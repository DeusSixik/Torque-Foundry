plugins {
    // JMH-бенчмарки физического солвера (hot path): sourceSet src/jmh/java,
    // запуск — gradle :common:jmh
    id 'me.champeau.jmh' version '0.7.3'
}

architectury {
    common rootProject.enabled_platforms.split(',')
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    modImplementation "dev.architectury:architectury:$rootProject.architectury_api_version"

    compileOnly "foundry.imguimc:imguimc-common-${minecraft_version}:$imguimc_version"

    // Unit tests for the physics simulation (pure JVM, no MC bootstrap)
    testImplementation platform("org.junit:junit-bom:5.10.2")
    testImplementation "org.junit.jupiter:junit-jupiter"

    jmh "org.openjdk.jmh:jmh-core:1.37"
    jmhAnnotationProcessor "org.openjdk.jmh:jmh-generator-annprocess:1.37"
}

jmh {
    // -prof gc: бенчмарк zero-alloc кода обязан подтверждать alloc.rate.norm
    profilers = ['gc']
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "failed", "skipped"
        showStandardStreams = true
    }
}
